<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
</head>
<body>

    <section>
    <div>
        <a href="wine.html"  class="arrow">
            <i class="ph ph-arrow-left"></i>
            Back to wine collection
        </a>
    </div>
    </section>

    <section class="contact">   
        <form action="" class="contact-form" name="order">
            <h6>Your Order Information here</h6>
            <input type="text" placeholder="Brand/Name Of Wine" class="wine-brand">
            <input type="number" placeholder="how many?" min="1" max="100" class="wine-num">
            <label for="">select a payment method</label>
            <select name="" id="" class="wine-pay">
                <option value="transfer"> Bank Transfer</option>
                <option value="paypal">Paypal</option>
                <option value="delivery">Payment on Delivery</option>
            </select>

            <button type="submit" name="order">place order</button>

        </form>
    </section>

    <section class="contact-footer">
        <h6 class="contact-flex">For Enquiry, Message us on
        <a href="https://wa.me/09037031857?text=Hi%20T-Bills%20Winery%20,%20I%20want%20to%20make%20an%20enquiry." target="_blank">
            <img src="images/whatsapp-logo.png" alt="whatsapp-logo" class="whatsapp-logo">
        </a>
        </h6>
    </section>
    
</body>
</html>
